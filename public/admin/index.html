<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Cofferino CMS</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Fix Decap CMS "Copy Path" button — removes /public prefix and ensures leading /
      document.addEventListener('click', function(e) {
        var btn = e.target && e.target.closest('button');
        if (!btn) return;
        var text = btn.textContent && btn.textContent.trim();
        if (text !== 'Copiază cale' && text !== 'Copy path' && text !== 'Copy Path') return;
        setTimeout(function() {
          navigator.clipboard.readText().then(function(val) {
            var fixed = val.replace(/^\/public\//, '/').replace(/^public\//, '/');
            if (fixed !== val) navigator.clipboard.writeText(fixed);
          }).catch(function() {});
        }, 100);
      }, true);
    </script>
  </body>
</html>
