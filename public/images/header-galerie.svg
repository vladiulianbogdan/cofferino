<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A2511"/>
      <stop offset="40%" style="stop-color:#7C4A2D"/>
      <stop offset="100%" style="stop-color:#C4714E"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="50%" r="35%">
      <stop offset="0%" style="stop-color:#E8A055;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#E8A055;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="40%" r="30%">
      <stop offset="0%" style="stop-color:#FEF6EC;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#FEF6EC;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#glow1)"/>
  <rect width="1200" height="420" fill="url(#glow2)"/>

  <!-- Photo frame decorations -->
  <!-- Frame 1 - left -->
  <rect x="60" y="60" width="180" height="140" rx="8" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <rect x="68" y="68" width="164" height="124" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="150" y="145" font-size="48" text-anchor="middle" opacity="0.4">🎨</text>

  <!-- Frame 2 - left-center -->
  <rect x="100" y="230" width="150" height="120" rx="8" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <rect x="108" y="238" width="134" height="104" rx="6" fill="rgba(255,255,255,0.05)"/>
  <text x="175" y="305" font-size="42" text-anchor="middle" opacity="0.35">🏕️</text>

  <!-- Frame 3 - right -->
  <rect x="980" y="50" width="160" height="130" rx="8" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <rect x="988" y="58" width="144" height="114" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="1060" y="128" font-size="44" text-anchor="middle" opacity="0.4">🎭</text>

  <!-- Frame 4 - right-bottom -->
  <rect x="1000" y="220" width="145" height="125" rx="8" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <rect x="1008" y="228" width="129" height="109" rx="6" fill="rgba(255,255,255,0.05)"/>
  <text x="1072" y="295" font-size="42" text-anchor="middle" opacity="0.35">⭐</text>

  <!-- Center camera icon -->
  <g transform="translate(530, 130)" opacity="0.25">
    <!-- Camera body -->
    <rect x="0" y="20" width="140" height="100" rx="12" fill="rgba(255,255,255,0.9)"/>
    <!-- Viewfinder bump -->
    <rect x="40" y="8" width="60" height="20" rx="6" fill="rgba(255,255,255,0.9)"/>
    <!-- Lens -->
    <circle cx="70" cy="70" r="32" fill="none" stroke="rgba(100,60,30,0.6)" stroke-width="5"/>
    <circle cx="70" cy="70" r="20" fill="rgba(100,60,30,0.3)"/>
    <circle cx="70" cy="70" r="10" fill="rgba(100,60,30,0.2)"/>
    <!-- Flash -->
    <circle cx="115" cy="38" r="8" fill="rgba(255,215,0,0.5)"/>
  </g>

  <!-- Scattered dots -->
  <circle cx="400" cy="80" r="3" fill="rgba(255,255,255,0.2)"/>
  <circle cx="550" cy="40" r="2" fill="rgba(255,255,255,0.15)"/>
  <circle cx="700" cy="90" r="3.5" fill="rgba(255,255,255,0.18)"/>
  <circle cx="850" cy="55" r="2" fill="rgba(255,255,255,0.12)"/>
  <circle cx="450" cy="360" r="2.5" fill="rgba(255,255,255,0.15)"/>
  <circle cx="750" cy="380" r="2" fill="rgba(255,255,255,0.12)"/>

  <!-- Bottom wave -->
  <path d="M0 380 Q300 350 600 370 Q900 390 1200 360 L1200 420 L0 420 Z" fill="rgba(0,0,0,0.18)"/>
</svg>
