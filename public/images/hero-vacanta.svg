      <stop offset="50%" style="stop-color:#6B3F9E"/>
      <stop offset="100%" style="stop-color:#C4714E"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#E8A055;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#E8A055;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>
  <!-- Stars -->
  <circle cx="100" cy="60" r="2" fill="rgba(255,255,255,0.7)"/>
