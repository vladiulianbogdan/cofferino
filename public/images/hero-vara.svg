<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D6A2D"/>
      <stop offset="50%" style="stop-color:#5A8A3A"/>
      <stop offset="100%" style="stop-color:#C4714E"/>
    </linearGradient>
    <radialGradient id="sun" cx="80%" cy="20%" r="30%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#sun)"/>
  <!-- Sun rays -->
  <circle cx="960" cy="80" r="120" fill="rgba(255,215,0,0.18)"/>
  <circle cx="960" cy="80" r="80" fill="rgba(255,215,0,0.22)"/>
  <circle cx="960" cy="80" r="45" fill="rgba(255,215,0,0.3)"/>
  <!-- Hills -->
  <ellipse cx="200" cy="450" rx="350" ry="120" fill="rgba(255,255,255,0.06)"/>
  <ellipse cx="700" cy="460" rx="400" ry="110" fill="rgba(255,255,255,0.04)"/>
  <ellipse cx="1100" cy="440" rx="300" ry="100" fill="rgba(255,255,255,0.05)"/>
  <!-- Decorative emojis -->
  <text x="120" y="260" font-size="80" text-anchor="middle" opacity="0.3">🌿</text>
  <text x="280" y="200" font-size="60" text-anchor="middle" opacity="0.25">⛺</text>
  <text x="420" y="300" font-size="50" text-anchor="middle" opacity="0.2">🦋</text>
  <text x="800" y="340" font-size="55" text-anchor="middle" opacity="0.2">🏕️</text>
  <text x="1050" y="280" font-size="50" text-anchor="middle" opacity="0.25">🌻</text>
  <!-- Dots -->
  <circle cx="550" cy="80" r="4" fill="rgba(255,255,255,0.2)"/>
  <circle cx="650" cy="120" r="3" fill="rgba(255,255,255,0.15)"/>
  <circle cx="350" cy="140" r="5" fill="rgba(255,255,255,0.12)"/>
  <!-- Bottom wave -->
  <path d="M0 370 Q300 330 600 360 Q900 390 1200 350 L1200 420 L0 420 Z" fill="rgba(0,0,0,0.15)"/>
</svg>
